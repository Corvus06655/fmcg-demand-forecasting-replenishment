<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">Demand forecasting workflow</title>
<desc id="desc">A five-stage workflow from historical sales data through data preparation, time-series feature engineering, model selection, and seven-day demand and replenishment recommendations.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16243a"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".28"/></filter>
</defs>
<rect width="1400" height="560" rx="28" fill="url(#bg)"/>
<text x="64" y="68" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">From historical sales to smarter replenishment</text>
<text x="64" y="102" fill="#a8b6cb" font-family="Inter,Arial,sans-serif" font-size="17">A time-aware machine-learning workflow for product-level demand planning</text>
<rect x="64" y="132" width="1272" height="4" rx="2" fill="url(#accent)"/>
<g transform="translate(64,188)" filter="url(#shadow)">
<rect width="224" height="222" rx="18" fill="#f8fafc"/>
<rect x="18" y="18" width="46" height="34" rx="10" fill="#dcfce7"/>
<text x="41" y="41" fill="#166534" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">01</text>
<text x="18" y="83" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">HISTORICAL DATA</text>
<text x="18" y="124" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="15">Sales · Date · Product</text>
<text x="18" y="150" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Category · Price · Promo</text>
<rect x="18" y="180" width="188" height="5" rx="2.5" fill="#dbe4ee"/>
</g><path d="M293 299 h20 l-7 -7 m7 7 l-7 7" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(324,188)" filter="url(#shadow)">
<rect width="224" height="222" rx="18" fill="#f8fafc"/>
<rect x="18" y="18" width="46" height="34" rx="10" fill="#dcfce7"/>
<text x="41" y="41" fill="#166534" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">02</text>
<text x="18" y="83" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">PREPARE &amp; EXPLORE</text>
<text x="18" y="124" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="15">Validate and clean</text>
<text x="18" y="150" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Daily product-date panel</text>
<rect x="18" y="180" width="188" height="5" rx="2.5" fill="#dbe4ee"/>
</g><path d="M553 299 h20 l-7 -7 m7 7 l-7 7" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(584,188)" filter="url(#shadow)">
<rect width="224" height="222" rx="18" fill="#f8fafc"/>
<rect x="18" y="18" width="46" height="34" rx="10" fill="#dcfce7"/>
<text x="41" y="41" fill="#166534" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">03</text>
<text x="18" y="83" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">FEATURE ENGINEERING</text>
<text x="18" y="124" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="15">Lag &amp; rolling features</text>
<text x="18" y="150" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Recency · Calendar signals</text>
<rect x="18" y="180" width="188" height="5" rx="2.5" fill="#dbe4ee"/>
</g><path d="M813 299 h20 l-7 -7 m7 7 l-7 7" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(844,188)" filter="url(#shadow)">
<rect width="224" height="222" rx="18" fill="#f8fafc"/>
<rect x="18" y="18" width="46" height="34" rx="10" fill="#dcfce7"/>
<text x="41" y="41" fill="#166534" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">04</text>
<text x="18" y="83" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">MODEL &amp; EVALUATE</text>
<text x="18" y="124" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="15">XGBoost / CatBoost</text>
<text x="18" y="150" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Chronological holdout</text>
<rect x="18" y="180" width="188" height="5" rx="2.5" fill="#dbe4ee"/>
</g><path d="M1073 299 h20 l-7 -7 m7 7 l-7 7" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(1104,188)" filter="url(#shadow)">
<rect width="224" height="222" rx="18" fill="#f8fafc"/>
<rect x="18" y="18" width="46" height="34" rx="10" fill="#dcfce7"/>
<text x="41" y="41" fill="#166534" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">05</text>
<text x="18" y="83" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">DECISION SUPPORT</text>
<text x="18" y="124" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="15">7-day demand estimate</text>
<text x="18" y="150" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Preliminary reorder quantity</text>
<rect x="18" y="180" width="188" height="5" rx="2.5" fill="#60a5fa"/>
</g>
<text x="64" y="466" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="16">Design principles</text>
<g font-family="Inter,Arial,sans-serif" font-size="14" fill="#a8b6cb">
<circle cx="70" cy="500" r="5" fill="#34d399"/><text x="84" y="505">No random shuffle for time-series evaluation</text>
<circle cx="455" cy="500" r="5" fill="#60a5fa"/><text x="469" y="505">Baseline and category-level comparisons</text>
<circle cx="870" cy="500" r="5" fill="#fbbf24"/><text x="884" y="505">Reorder output is preliminary, not production advice</text>
</g>
</svg>
