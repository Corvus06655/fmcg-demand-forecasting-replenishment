name: Validate forecasting notebook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate notebook structure and cleared outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("notebooks/demand_forecasting.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          assert notebook.get("nbformat") == 4, "Expected a Jupyter notebook v4 file"
          cells = notebook.get("cells", [])
          assert cells, "Notebook contains no cells"
          code_cells = [cell for cell in cells if cell.get("cell_type") == "code"]
          assert code_cells, "Notebook contains no code cells"
          assert all(not cell.get("outputs") for cell in code_cells), "Clear notebook outputs before committing"
          print(f"Notebook structure passed: {len(cells)} cells, {len(code_cells)} code cells")
          PY
